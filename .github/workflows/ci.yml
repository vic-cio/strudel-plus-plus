name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  desktop:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Restore pinned Strudel artifact cache
        uses: actions/cache@v4
        with:
          path: app/.external/strudel
          key: strudel-artifacts-${{ runner.os }}-${{ hashFiles('scripts/fetch-upstream-artifacts.mjs') }}
          restore-keys: |
            strudel-artifacts-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify wrapper boundary
        run: pnpm verify:boundary
      - name: Check formatting
        run: pnpm format-check
      - name: Lint
        run: pnpm lint
      - name: Test desktop app
        run: pnpm test
      - name: Typecheck desktop app
        run: pnpm typecheck
      - name: Build and verify macOS app
        run: pnpm build
